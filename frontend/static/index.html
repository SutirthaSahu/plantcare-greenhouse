<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlantCare Greenhouse</title>
<!-- Fonts: Outfit & Plus Jakarta Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #059669;
    --accent-light: #10b981;
    --accent-dark: #047857;
    --accent-gradient: linear-gradient(135deg, #059669 0%, #047857 100%);
    --bg-gradient: linear-gradient(180deg, #f0fdf4 0%, #e6f4ea 100%);
    --border: #a7f3d0;
    --border-subtle: rgba(167, 243, 208, 0.5);
    --card-bg: rgba(255, 255, 255, 0.9);
    --shadow-sm: 0 2px 8px rgba(5, 150, 105, 0.06);
    --shadow-md: 0 8px 24px rgba(5, 150, 105, 0.12);
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: var(--bg-gradient);
    color: #1f2937;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* --- Premium Header --- */
  header {
    background: var(--accent-gradient);
    color: #fff;
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 15px rgba(4, 120, 87, 0.2);
    z-index: 10;
  }

  .brand-container {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .brand-logo {
    font-size: 1.75rem;
    background: rgba(255, 255, 255, 0.2);
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    backdrop-filter: blur(4px);
  }

  .brand-title {
    font-family: 'Outfit', sans-serif;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .brand-subtitle {
    font-size: 0.75rem;
    opacity: 0.9;
    font-weight: 500;
    margin: 0;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: rgba(255, 255, 255, 0.15);
    padding: 0.35rem 0.75rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: #34d399;
    border-radius: 50%;
    box-shadow: 0 0 8px #34d399;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.95); opacity: 0.8; }
    50% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.8; }
  }

  /* --- Dialogue Container (#log) --- */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    scroll-behavior: smooth;
  }

  #log::-webkit-scrollbar {
    width: 6px;
  }
  #log::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }

  /* --- Message Bubbles --- */
  .msg {
    display: flex;
    flex-direction: column;
    animation: fadeIn 0.3s ease-out forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-items: flex-end;
  }

  .msg.agent {
    align-items: flex-start;
  }

  .msg-avatar {
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
    color: var(--accent-dark);
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  .bubble {
    display: inline-block;
    padding: 0.85rem 1.15rem;
    border-radius: 18px;
    background: var(--card-bg);
    border: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-sm);
    text-align: left;
    max-width: 85%;
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 0.95rem;
  }

  .msg.user .bubble {
    background: var(--accent-gradient);
    color: #fff;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: var(--shadow-md);
  }

  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
    background: #ffffff;
  }

  /* When reply is an A2UI card, remove bubble background */
  .bubble.rich {
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    max-width: 100%;
    box-shadow: none !important;
    white-space: normal;
  }

  /* --- Example Prompt Chips --- */
  .examples-row {
    display: flex;
    gap: 0.6rem;
    padding: 0.75rem 1.25rem;
    justify-content: center;
    flex-wrap: wrap;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--border-subtle);
    max-width: 860px;
    margin: 0 auto;
    width: 100%;
    border-radius: 16px 16px 0 0;
  }

  .chip {
    background: #ecfdf5;
    color: var(--accent-dark);
    border: 1px solid var(--border);
    padding: 0.5rem 0.95rem;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: 0 2px 6px rgba(5, 150, 105, 0.08);
  }

  .chip:hover {
    background: var(--accent-gradient);
    color: #fff;
    border-color: transparent;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
  }

  /* --- Input Form Container --- */
  form {
    display: flex;
    gap: 0.75rem;
    padding: 1rem 1.25rem;
    background: #ffffff;
    border-top: 1px solid var(--border-subtle);
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04);
  }

  input {
    flex: 1;
    padding: 0.85rem 1.15rem;
    border: 1.5px solid #d1d5db;
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    transition: all 0.2s ease;
    background: #f9fafb;
  }

  input:focus {
    outline: none;
    border-color: var(--accent-light);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
  }

  button.send-btn {
    padding: 0.85rem 1.5rem;
    border: none;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #fff;
    font-weight: 700;
    font-family: 'Outfit', sans-serif;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
  }

  button.send-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(5, 150, 105, 0.35);
  }

  /* --- A2UI Component Render Styles --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    background: #ffffff;
    box-shadow: var(--shadow-md);
    max-width: 100%;
    transition: transform 0.2s ease;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  
  .a2text { margin: 0; line-height: 1.5; color: #374151; }
  .a2text.a2-h1 { font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 700; color: var(--accent-dark); }
  .a2text.a2-h2 { font-family: 'Outfit', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--accent-dark); }
  .a2text.a2-h3 { font-family: 'Outfit', sans-serif; font-size: 1.15rem; font-weight: 600; color: #111827; }
  .a2text.a2-h4 { font-family: 'Outfit', sans-serif; font-size: 1.05rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: #6b7280; }
  
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.3rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="brand-container">
    <div class="brand-logo">🪴</div>
    <div>
      <h1 class="brand-title">PlantCare Greenhouse</h1>
      <p class="brand-subtitle">AI Assistant • Powered by Agent Engine</p>
    </div>
  </div>
  <div class="status-badge">
    <span class="status-dot"></span>
    <span>Online</span>
  </div>
</header>

<div id="log"></div>

<div class="examples-row">
  <button type="button" class="chip" onclick="sendExample('What plants do you recommend for bright indirect light?')">🌱 Recommend Plants</button>
  <button type="button" class="chip" onclick="sendExample('Calculate fertilizer dilution ratio for 5 liters of water')">🧪 Fertilizer Calc</button>
  <button type="button" class="chip" onclick="sendExample('Show care schedule and watering frequency for Peace Lily')">🪴 Peace Lily Care</button>
</div>

<form id="form">
  <input id="input" placeholder="Ask about plants, care tips, weather, or calculations…" autocomplete="off" autofocus>
  <button class="send-btn">Send 🚀</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function sendExample(txt) {
  input.value = txt;
  if (typeof form.requestSubmit === "function") {
    form.requestSubmit();
  } else {
    form.dispatchEvent(new Event("submit", { cancelable: true }));
  }
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "msg-avatar", who === "user" ? "You" : "🌿 PlantCare Assistant");
  m.appendChild(avatar);
  const b = el("div", "bubble");
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
